<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Simulación cardio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/fig.css">
<style>
.simbar{background:#26232E;color:#fff;border-radius:16px;padding:10px 12px;margin:10px 0;font-size:13px}
.simbar b{display:block;margin-bottom:6px}
.simbar .segs{margin:0;background:rgba(255,255,255,.1)}.simbar .seg{color:#fff}
.fases{display:flex;gap:4px;margin:12px 0 6px}
.fases div{border-radius:12px;padding:8px 6px;text-align:center;background:var(--soft);position:relative;overflow:hidden}
.fases div b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fases div span{font-size:12px;color:var(--txt2)}
.fases div.on{outline:2.5px solid var(--acc)}.fases div.ok{opacity:.55}
.fases u{position:absolute;left:0;bottom:0;height:4px;background:var(--acc)}
.cuenta{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1;margin:4px 0}
.fasenom{text-align:center}
.fijo{display:flex;gap:8px;margin-top:10px}.fijo div{flex:1;background:var(--soft);border-radius:14px;padding:10px;text-align:center}
.fijo b{display:block;font-size:20px}.fijo span{font-size:12px;color:var(--txt2)}
.selrow{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px;margin:10px 0}
.selrow > span{font-weight:700;font-size:14px;color:var(--txt2)}
.sel{display:grid;grid-template-columns:52px 1fr 52px;height:58px;background:var(--soft);border-radius:14px;align-items:center}
.sel button{border:0;background:transparent;font-size:26px;height:100%;color:var(--txt2);cursor:pointer}
.sel .val{border:0;background:transparent;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--txt)}
.sel .val small{font-size:14px;font-weight:600;color:var(--txt2)}
.bloque.activo{outline:2.5px solid var(--acc)}
.tramos{list-style:none;padding:0;margin:12px 0 0}
.tramos li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:9px 10px;border-radius:12px;background:var(--soft);margin-top:6px;font-size:14px}
.tramos li.actual{background:color-mix(in srgb,var(--acc) 16%,var(--soft));font-weight:700}
.tramos li i{font-style:normal;color:var(--txt2);font-size:12px;font-variant-numeric:tabular-nums}
.tramos li em{font-style:normal;font-variant-numeric:tabular-nums}
.nuevos{margin-top:12px}
.btn[disabled]{opacity:.35}
.resum li{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.resum li:first-child{border-top:0}
.resum li b{font-variant-numeric:tabular-nums}
.nota.centro{text-align:center}
</style>
</head>
<body>
<div id="app"><main class="vista entreno" id="v"></main></div>
<div id="hoja" class="hoja" hidden></div>
<script type="module">
import { animar } from "./js/figuras.js";

const DIA = { corto: { nombre: "Cardio corto", principal: 25 }, largo: { nombre: "Cardio largo", principal: 45 } };
const CAL = { min: 2, vel: 4.0, inc: 2 }, ENF = { min: 2, vel: 3.0, inc: 0 };
const VELS = Array.from({ length: 21 }, (_, i) => Math.round((4 + i * 0.1) * 10) / 10);
const INCS = Array.from({ length: 9 }, (_, i) => i);
const f1 = (n) => n.toFixed(1).replace(".", ",");
const mmss = (s) => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

let tipo = "corto", factor = 30;
const FIGEL = document.createElement("div"); FIGEL.className = "bigfig"; animar(FIGEL, "cinta");
let E; // estado de la simulación
function reset() {
  E = { inicio: null, pausa: null, pausado: 0, salto: 0, vel: 5.0, inc: 5, tramos: [], hecho: false, dif: null };
}
reset();
const fases = () => [
  { id: "cal", nombre: "Calentamiento", corto: "Calentar", min: CAL.min },
  { id: "pri", nombre: "Bloque principal", corto: "Bloque principal", min: DIA[tipo].principal },
  { id: "enf", nombre: "Enfriamiento", corto: "Enfriar", min: ENF.min },
].reduce((a, f) => { const ini = a.length ? a[a.length - 1].fin : 0; a.push({ ...f, ini, fin: ini + f.min * 60 }); return a; }, []);
const total = () => fases()[2].fin;
function trans() {
  if (!E.inicio) return 0;
  const ahora = E.pausa || performance.now();
  return Math.min(total(), ((ahora - E.inicio - E.pausado) / 1000) * factor + E.salto);
}
const faseAct = (t) => fases().find((f) => t < f.fin) || fases()[2];
// Tramos del bloque principal: { desde (s dentro del bloque), vel, inc }
function tramoActual() { return E.tramos[E.tramos.length - 1]; }
function abrirBloque() { if (!E.tramos.length) E.tramos.push({ desde: 0, vel: E.vel, inc: E.inc }); }

function resumen() {
  const F = fases(), pri = F[1], dur = pri.min * 60;
  const tPri = Math.min(dur, Math.max(0, trans() - pri.ini));
  const comb = new Map();
  E.tramos.forEach((tr, i) => {
    const hasta = i < E.tramos.length - 1 ? E.tramos[i + 1].desde : tPri;
    const k = `${tr.vel}|${tr.inc}`;
    comb.set(k, (comb.get(k) || 0) + Math.max(0, hasta - tr.desde));
  });
  return [...comb.entries()].map(([k, s]) => { const [v, i] = k.split("|"); return { vel: +v, inc: +i, s }; });
}

function render() {
  const F = fases(), t = trans(), fa = faseAct(t);
  const enPri = E.inicio && fa.id === "pri" && !E.hecho;
  const pri = F[1], tPri = Math.max(0, Math.min(pri.min * 60, t - pri.ini));
  const tramosHtml = E.tramos.map((tr, i) => {
    const hasta = i < E.tramos.length - 1 ? E.tramos[i + 1].desde : tPri;
    const actual = i === E.tramos.length - 1 && enPri;
    return `<li class="${actual ? "actual" : ""}"><i>Tramo ${i + 1}<br>min ${mmss(tr.desde)}</i><span>${f1(tr.vel)} km/h · ${tr.inc} %</span><em>${mmss(hasta - tr.desde)}</em></li>`;
  }).join("");
  const sel = (id, val, unidad) => `<div class="sel"><button data-a="${id}" data-d="-1">−</button><button class="val" data-a="${id}Hoja">${val}<small> ${unidad}</small></button><button data-a="${id}" data-d="1">+</button></div>`;
  const res = resumen();
  document.getElementById("v").innerHTML = `
    <div class="simbar"><b>🧪 Simulación (no es la app todavía)</b>
      <div class="segs"><button class="seg ${tipo === "corto" ? "on" : ""}" style="--c:#C2456B" data-a="tipo" data-v="corto">Miércoles · corto</button><button class="seg ${tipo === "largo" ? "on" : ""}" style="--c:#C2456B" data-a="tipo" data-v="largo">Viernes · largo</button></div>
      <div class="segs" style="margin-top:6px">${[1, 30, 120].map((x) => `<button class="seg ${factor === x ? "on" : ""}" style="--c:#7A5BB5" data-a="vel" data-v="${x}">${x === 1 ? "Tiempo real" : "×" + x + " rápido"}</button>`).join("")}</div></div>
    <header class="wbar" style="position:static;margin:0;padding:6px 0"><button class="x">✕</button><div class="wt"><b>${DIA[tipo].nombre} · ${Math.round(total() / 60)} min</b><span>Semana 1 · Fase menstrual</span></div><div class="reloj"><b>${mmss(t)}</b><span>de ${mmss(total())}</span></div></header>
    <section class="card cardiocard">
      <div id="figph"></div>
      <div class="fases">${F.map((f) => `<div style="flex:${Math.max(f.min, 9)}" class="${f.id === fa.id && E.inicio && !E.hecho ? "on" : ""} ${t >= f.fin ? "ok" : ""}"><b>${f.corto}</b><span>${f.min} min</span><u style="width:${Math.min(100, Math.max(0, (t - f.ini) / (f.fin - f.ini) * 100))}%"></u></div>`).join("")}</div>
      ${E.hecho ? `<p class="fasenom etq">Completado</p>` : `<div class="fasenom etq">${E.inicio ? fa.nombre : "Preparada"}</div><div class="cuenta">${mmss(E.inicio ? fa.fin - t : F[0].fin)}</div>`}
      ${!E.hecho && (!E.inicio || fa.id === "cal") ? `<div class="fijo"><div><b>${f1(CAL.vel)}</b><span>km/h</span></div><div><b>${CAL.inc} %</b><span>inclinación</span></div></div><p class="nota centro">Calentamiento fijo: 2 min a 4,0 km/h y 2 %</p>` : ""}
      ${!E.hecho && E.inicio && fa.id === "enf" ? `<div class="fijo"><div><b>${f1(ENF.vel)}</b><span>km/h</span></div><div><b>${ENF.inc} %</b><span>inclinación</span></div></div><p class="nota centro">Enfriamiento fijo: 2 min a 3,0 km/h y 0 %</p>` : ""}
      <div class="wfoot dentro">${E.hecho ? "" : !E.inicio ? `<button class="btn" data-a="go">Empezar</button>` : `<button class="btn sec" data-a="pausa">${E.pausa ? "Reanudar" : "Pausa"}</button><button class="btn sec" data-a="saltar">Saltar fase ›</button>`}</div>
    </section>

    <section class="card bloque ${enPri ? "activo" : ""}">
      <h3>Bloque principal · ${pri.min} min</h3>
      <p class="suave" style="font-size:14px;margin:0">${enPri ? "Elige lo que estás haciendo ahora en la cinta." : E.inicio && t >= pri.fin ? "Bloque terminado." : "Puedes dejarlo elegido antes de que empiece."}</p>
      ${E.hecho || (E.inicio && t >= pri.fin) ? "" : `<div class="selrow"><span>Velocidad</span>${sel("v", f1(E.vel), "km/h")}</div><div class="selrow"><span>Inclinación</span>${sel("i", E.inc, "%")}</div>`}
      ${tramosHtml ? `<ul class="tramos">${tramosHtml}</ul>` : ""}
    </section>

    ${E.hecho ? "" : `<button class="btn nuevos" data-a="nuevos" ${enPri ? "" : "disabled"}>＋ Nuevos parámetros</button>
    <p class="nota centro">${enPri ? `Marca el minuto ${mmss(tPri)} del bloque y empieza un tramo nuevo.` : "Se activa durante el bloque principal."}</p>`}

    <section class="card"><h3>Enfriamiento · 2 min</h3><p class="suave" style="margin:0">Fijo: 3,0 km/h y 0 %</p></section>

    ${E.hecho ? `<section class="card difsel"><h3>Así ha quedado en Progreso</h3>
      <ul class="lista compacta resum"><li><span>Calentamiento</span><b>2 min · 4,0 km/h · 2 %</b></li>
      ${res.map((r) => `<li><span>Bloque principal</span><b>${Math.round(r.s / 60)} min · ${f1(r.vel)} km/h · ${r.inc} %</b></li>`).join("")}
      <li><span>Enfriamiento</span><b>2 min · 3,0 km/h · 0 %</b></li></ul>
      <h3 style="margin-top:14px">¿Cómo te ha resultado?</h3><div class="difs">${["facil", "normal", "dificil"].map((k) => `<button class="dif ${k} ${E.dif === k ? "on" : ""}" data-a="dif" data-v="${k}">${{ facil: "Fácil", normal: "Normal", dificil: "Difícil" }[k]}</button>`).join("")}</div>
      <button class="btn sec" data-a="reset">Volver a simular</button></section>` : ""}
  `;
  // La figura se conserva entre refrescos para que la animación no se reinicie
  FIGEL.style.setProperty("--inc", fa.id === "cal" ? CAL.inc : fa.id === "enf" ? ENF.inc : E.inc);
  document.getElementById("figph")?.replaceWith(FIGEL);
}

function abrirHoja(tipoSel) {
  const h = document.getElementById("hoja");
  const vals = tipoSel === "v" ? VELS : INCS, actual = tipoSel === "v" ? E.vel : E.inc;
  h.innerHTML = `<div class="hcont"><div class="hcab"><b>${tipoSel === "v" ? "Velocidad (km/h)" : "Inclinación (%)"}</b><button class="mini" data-a="cerrar">Cerrar</button></div>
    <div class="hgrid">${vals.map((v) => `<button class="hv ${v === actual ? "on" : ""}" data-a="pon" data-t="${tipoSel}" data-v="${v}">${tipoSel === "v" ? f1(v) : v}</button>`).join("")}</div></div>`;
  h.hidden = false;
}
function poner(tipoSel, v) {
  if (tipoSel === "v") E.vel = Math.min(6, Math.max(4, Math.round(v * 10) / 10)); else E.inc = Math.min(8, Math.max(0, Math.round(v)));
  const tr = tramoActual();
  // Cambiar velocidad/inclinación corrige el tramo en curso; "Nuevos parámetros" es lo que abre un tramo nuevo.
  if (tr && faseAct(trans()).id === "pri" && !E.hecho) { tr.vel = E.vel; tr.inc = E.inc; }
}

document.addEventListener("click", (ev) => {
  if (ev.target.id === "hoja") { ev.target.hidden = true; return; }
  const el = ev.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a;
  if (a === "tipo") { tipo = el.dataset.v; reset(); }
  else if (a === "vel") { const t = trans(); factor = +el.dataset.v; if (E.inicio) { E.salto = t; E.inicio = performance.now(); E.pausado = 0; if (E.pausa) E.pausa = E.inicio; } }
  else if (a === "go") { E.inicio = performance.now(); }
  else if (a === "pausa") { if (E.pausa) { E.pausado += performance.now() - E.pausa; E.pausa = null; } else E.pausa = performance.now(); }
  else if (a === "saltar") { const t = trans(), f = faseAct(t); E.salto += f.fin - t + 0.01; }
  else if (a === "v" || a === "i") poner(a, (a === "v" ? E.vel : E.inc) + (+el.dataset.d) * (a === "v" ? 0.1 : 1));
  else if (a === "vHoja") return abrirHoja("v");
  else if (a === "iHoja") return abrirHoja("i");
  else if (a === "pon") { poner(el.dataset.t, +el.dataset.v); document.getElementById("hoja").hidden = true; }
  else if (a === "cerrar") { document.getElementById("hoja").hidden = true; return; }
  else if (a === "nuevos") { const tPri = trans() - fases()[1].ini; E.tramos.push({ desde: tPri, vel: E.vel, inc: E.inc }); }
  else if (a === "dif") E.dif = el.dataset.v;
  else if (a === "reset") reset();
  render();
});
let ultimaFase = "";
setInterval(() => {
  if (!E.inicio || E.hecho || E.pausa) return;
  const t = trans(), fa = faseAct(t);
  if (fa.id === "pri") abrirBloque();
  if (t >= total()) E.hecho = true;
  if (fa.id !== ultimaFase) { ultimaFase = fa.id; }
  // refresco ligero: sólo si no hay hoja abierta
  if (document.getElementById("hoja").hidden) render();
}, 250);
render();
</script>
</body>
</html>
