<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Entreno se ha mudado</title>
<meta name="robots" content="noindex, nofollow">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F6F2EE;color:#26232E;font-family:ui-rounded,-apple-system,system-ui,sans-serif;padding:24px;text-align:center}
@media (prefers-color-scheme:dark){body{background:#141218;color:#F2EFF6}}
main{max-width:380px}h1{font-size:26px;margin:0 0 10px}p{color:#6D6878;margin:0 0 20px;line-height:1.45}
a{display:block;background:#C2456B;color:#fff;text-decoration:none;font-weight:750;border-radius:16px;padding:16px}
</style>
</head>
<body>
<main>
  <h1>Mi Entreno se ha mudado</h1>
  <p>La app ahora vive en una dirección nueva. Ábrela ahí y añádela a la pantalla de inicio. Puedes borrar este icono.</p>
  <a href="https://mavi-meerkat.github.io/eska/">Ir a la nueva app</a>
</main>
<script>
// Limpia la versión antigua instalada en esta dirección
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => { if (r.scope.includes("/gym/")) r.unregister(); }));
if (window.caches) caches.keys().then((ks) => ks.filter((k) => k.startsWith("gym-")).forEach((k) => caches.delete(k)));
</script>
</body>
</html>
